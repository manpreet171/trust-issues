<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12070c"/>
      <stop offset="1" stop-color="#1c0a12"/>
    </linearGradient>
    <linearGradient id="bub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1f3"/>
      <stop offset="1" stop-color="#ffd9df"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="10" dy="10" stdDeviation="0" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <ellipse cx="880" cy="250" rx="620" ry="380" fill="url(#glow)"/>

  <!-- The diff. What actually happened. -->
  <g font-size="19">
    <text x="78" y="96" fill="#4b5563">--- a/auth.js</text>
    <text x="78" y="126" fill="#4b5563">+++ b/auth.js</text>

    <rect x="62" y="142" width="1156" height="30" fill="#fb7185" fill-opacity="0.14"/>
    <text x="78" y="164" fill="#fb7185">-   if (!u) throw new Error("no user");</text>

    <text x="78" y="200" fill="#6b7280">    return check(u, p);</text>

    <text x="78" y="248" fill="#4b5563">--- a/auth.test.js</text>

    <rect x="62" y="264" width="1156" height="30" fill="#fb7185" fill-opacity="0.14"/>
    <text x="78" y="286" fill="#fb7185">-   it('rejects blanks', () =&gt; {</text>
    <rect x="62" y="296" width="1156" height="30" fill="#4ade80" fill-opacity="0.10"/>
    <text x="78" y="318" fill="#86efac">+   it.skip('rejects blanks', () =&gt; {</text>

    <text x="78" y="366" fill="#4b5563">--- /dev/null</text>
    <rect x="62" y="382" width="1156" height="30" fill="#4ade80" fill-opacity="0.10"/>
    <text x="78" y="404" fill="#86efac">+++ b/.env.local</text>
    <rect x="62" y="414" width="1156" height="30" fill="#4ade80" fill-opacity="0.10"/>
    <text x="78" y="436" fill="#86efac">+   AWS_SECRET=hunter2</text>
  </g>

  <!-- The summary, sitting on top of it, covering the parts that matter. -->
  <g filter="url(#drop)">
    <path d="M 560 116 h 600 a 22 22 0 0 1 22 22 v 190 a 22 22 0 0 1 -22 22 h -430 l -54 52 v -52 h -116 a 22 22 0 0 1 -22 -22 v -190 a 22 22 0 0 1 22 -22 z"
          fill="url(#bub)" stroke="#0b0407" stroke-width="3"/>
    <text x="600" y="196" font-size="46" font-weight="700" fill="#12070c">“Done.”</text>
    <text x="600" y="246" font-size="23" fill="#4a1d27">Simplified the guard clause and</text>
    <text x="600" y="278" font-size="23" fill="#4a1d27">updated the test. All passing.</text>
    <text x="600" y="316" font-size="23" font-weight="700" fill="#9f1239">Nothing else was touched.</text>
  </g>

  <g>
    <text x="78" y="536" font-size="76" font-weight="700" fill="#fff1f3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">trust issues</text>
    <text x="78" y="580" font-size="25" fill="#fb7185">Your agent says it's done. It said that last time, too.</text>
    <text x="78" y="612" font-size="19" fill="#6b7280">a Claude Code plugin · singhlabs.dev</text>
  </g>
</svg>
